name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [master]

permissions: read-all

jobs:
  # release.yml triggers on this same push, with no ordering between the two
  # workflows. Scorecard's Signed-Releases and Packaging checks read the
  # newest GitHub Release's assets, so a push that ships a release could be
  # scored before release.yml has published it. This job closes that race —
  # and only when there is one to close: it is a fast no-op on every trigger
  # except a push that actually produces a release.
  #
  # ossf/scorecard-action's publish API rejects a workflow where the job
  # calling the action contains any step without `uses:` (see
  # .github/scripts/wait-for-release.sh for the source reference), so the wait
  # can't be a step in the `analysis` job below — it has to be a separate job.
  gate:
    name: wait for the release this push produces, if any
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read package.json and tag refs
      actions: read         # poll release.yml's run status
    outputs:
      proceed: ${{ steps.wait.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-release.sh

  analysis:
    name: OpenSSF Scorecard
    needs: gate
    # always(): a failure in `gate` itself (not a release failure — see the
    # script) should still let this run, the same best-effort fallback the
    # script uses on its own timeout. Only an explicit `proceed: false` from a
    # confirmed release failure skips the scan.
    if: always() && needs.gate.outputs.proceed != 'false'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true      # feeds the public scorecard badge
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

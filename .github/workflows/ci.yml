name: ci

# Gates pull requests. Nothing here runs on master: the branch is
# pull-request-only and must be up to date before merging, so the commit that
# lands is the commit these checks passed on. The release pipeline re-runs lint
# and tests before it publishes anything.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # macOS always has sandbox-exec, so a missing backend there is a real
          # regression and must fail rather than skip. Linux runners forbid the
          # user namespaces bwrap needs; the sandbox-linux job covers that path.
          KRONK_SANDBOX_REQUIRED: ${{ runner.os == 'macOS' && '1' || '' }}

  smoke:
    # The CLI must start and print help without a Kronk server present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node src/index.js --help
      - name: fails cleanly with no server
        run: |
          if node src/index.js "hello" > out.txt 2>&1; then
            echo "expected a non-zero exit without a server"; exit 1
          fi
          grep -q "Cannot reach Kronk" out.txt
      - run: npm pack --dry-run

  sandbox-linux:
    # GitHub's runners disable unprivileged user namespaces, so bwrap cannot
    # start and the confinement tests would skip while CI stayed green. Run them
    # somewhere namespaces are permitted, so the Linux path is proven and not
    # merely assumed — the same reasoning as the egress proof in security.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bwrap really denies the writes and reads it claims to
        run: |
          docker run --rm --privileged -v "$PWD":/repo -w /repo node:24-bookworm bash -euo pipefail -c '
            apt-get update -qq && apt-get install -y -qq bubblewrap
            # A real secret to try to read, so the denial test has something to fail on.
            mkdir -p /root/.ssh && echo "PRIVATE KEY MATERIAL" > /root/.ssh/id_rsa
            KRONK_SANDBOX_REQUIRED=1 node --test test/sandbox.test.js
          '

  # A single stable context for branch protection to require. Matrix jobs get
  # names like "check (ubuntu-latest, 20)", which change whenever the matrix
  # does and cannot be pinned in a ruleset.
  ci-ok:
    if: always()
    needs: [check, smoke, sandbox-linux]
    runs-on: ubuntu-latest
    steps:
      - name: fail if anything upstream failed
        run: |
          [ "${{ needs.check.result }}" = "success" ] || exit 1
          [ "${{ needs.smoke.result }}" = "success" ] || exit 1
          [ "${{ needs.sandbox-linux.result }}" = "success" ] || exit 1
          echo "all checks passed"

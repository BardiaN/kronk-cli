name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  smoke:
    # The CLI must start and print help without a Kronk server present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node src/index.js --help
      - name: fails cleanly with no server
        run: |
          if node src/index.js "hello" > out.txt 2>&1; then
            echo "expected a non-zero exit without a server"; exit 1
          fi
          grep -q "Cannot reach Kronk" out.txt
      - run: npm pack --dry-run

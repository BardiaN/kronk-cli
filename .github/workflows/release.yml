name: release

# Merging to master is the release trigger. A merge only releases when
# package.json carries a version that has no tag yet, so ordinary merges pass
# straight through and a version bump is what ships.
#
# The tag is created inside this run rather than by a separate workflow: a tag
# pushed with GITHUB_TOKEN does not start another workflow, so a "tag on merge"
# job would look green and silently never publish.
on:
  push:
    branches: [master]
  workflow_dispatch:        # re-run a release that failed after the tag existed

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

jobs:
  gate:
    name: is this a release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"
          # Asking the API beats fetching every tag, and makes a re-run
          # idempotent: once the tag exists this commit is no longer a release.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v$v" >/dev/null 2>&1; then
            echo "v$v is already tagged — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v has no tag yet — releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  tag:
    needs: [gate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the tag this release is named for
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: tag the release commit
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "kronk-cli ${TAG#v}"
          git push origin "$TAG"

  npm:
    needs: [gate, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Deliberately no `cache: npm`: the cache step writes an .npmrc that
          # can shadow the OIDC credential. This used to be expressed as
          # `package-manager-cache: false`, which setup-node does not accept —
          # it warned "Unexpected input(s)" on every release and did nothing.
      - run: npm ci
      # Trusted publishing: npm mints a short-lived credential from the OIDC
      # token above, so there is no NPM_TOKEN in this repository at all. The
      # publisher is pinned to this repo and this workflow filename on npmjs.com.
      #
      # No --provenance flag: it is implied by trusted publishing, and passing
      # it explicitly changes the auth path npm takes.
      - run: npm publish --access public

  github-release:
    needs: [gate, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: compute tarball hash
        id: hash
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          # GitHub generates tag archives on demand and briefly serves a cached
          # one after a tag moves. Hash twice and require agreement, or the tap
          # gets pinned to a checksum that no longer matches the download.
          for attempt in 1 2 3 4 5; do
            curl -fsSL "$url" -o a.tar.gz; sleep 3
            curl -fsSL "$url" -o b.tar.gz
            ha=$(shasum -a 256 a.tar.gz | cut -d' ' -f1)
            hb=$(shasum -a 256 b.tar.gz | cut -d' ' -f1)
            [ "$ha" = "$hb" ] && break
            echo "archive still settling (attempt $attempt)"; sleep 10
          done
          [ "$ha" = "$hb" ] || { echo "archive hash never stabilised"; exit 1; }
          echo "sha256=$ha" >> "$GITHUB_OUTPUT"
      - name: build the tarball that will be attested
        run: npm pack

      # A signed statement tying this artifact to this repo, commit and workflow.
      # `gh attestation verify` checks it without trusting the registry.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tgz"

      # That attestation lives only in GitHub's attestations API, which means it
      # cannot be checked offline, and it is invisible to anyone auditing the
      # release itself — OpenSSF Scorecard's Signed-Releases check reads the
      # release's own assets and reported this project as publishing none.
      #
      # So ship the same signed statement as files beside the tarball. The
      # Sigstore bundle is what cosign and `gh attestation verify --bundle`
      # consume; the DSSE envelope it wraps is the .intoto.jsonl that SLSA
      # tooling expects. Neither is a second signature — both are the one the
      # step above produced, written where a downloader can reach them.
      - name: publish the attestation beside the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tgz=$(ls -1 ./*.tgz | head -1)
          test -s "$BUNDLE"
          cp "$BUNDLE" "${tgz}.sigstore.json"
          # One envelope per line. jq streams concatenated objects, so this
          # stays correct if a future release attests more than one subject.
          jq -c '.dsseEnvelope' "$BUNDLE" > "${tgz}.intoto.jsonl"
          # An envelope that is absent or unsigned would upload a file that
          # proves nothing, which is worse than uploading none at all.
          test -s "${tgz}.intoto.jsonl"
          jq -e '.payload and (.signatures | length > 0)' "${tgz}.intoto.jsonl" > /dev/null

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # The run is on a branch, so the tag has to be named explicitly.
          tag_name: ${{ needs.gate.outputs.tag }}
          generate_release_notes: true
          files: |
            *.tgz
            *.tgz.sigstore.json
            *.tgz.intoto.jsonl

  homebrew:
    needs: [gate, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read         # pushes to the tap over the deploy key, not GITHUB_TOKEN
    steps:
      # A deploy key scoped to the tap alone, rather than a personal token that
      # would carry rights over every repository the owner can touch.
      - name: authorise against the tap
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: bump the formula
        env:
          VERSION: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.github-release.outputs.sha256 }}
          TAP_REPO: ${{ vars.TAP_REPO }}
        run: |
          set -euo pipefail
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone "git@github.com:${TAP_REPO}.git" tap
          cd tap
          v="${VERSION#v}"
          # Homebrew derives the version from the tag in the URL, so only the
          # url and its checksum need rewriting.
          sed -i -E "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/kronk-cli.rb
          sed -i -E "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/kronk-cli.rb
          if git diff --quiet; then
            echo "formula unchanged — refusing to call that a successful bump"
            grep -E 'url |sha256 ' Formula/kronk-cli.rb
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "kronk-cli ${v}"
          git push

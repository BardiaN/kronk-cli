name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  smoke:
    # The CLI must start and print help without a Kronk server present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node src/index.js --help
      - name: fails cleanly with no server
        run: |
          if node src/index.js "hello" > out.txt 2>&1; then
            echo "expected a non-zero exit without a server"; exit 1
          fi
          grep -q "Cannot reach Kronk" out.txt
      - run: npm pack --dry-run

  # A single stable context for branch protection to require. Matrix jobs get
  # names like "check (ubuntu-latest, 20)", which change whenever the matrix
  # does and cannot be pinned in a ruleset.
  ci-ok:
    if: always()
    needs: [check, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: fail if anything upstream failed
        run: |
          [ "${{ needs.check.result }}" = "success" ] || exit 1
          [ "${{ needs.smoke.result }}" = "success" ] || exit 1
          echo "all checks passed"

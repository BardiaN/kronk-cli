name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # a fresh scan weekly, even with no commits

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
          # security-extended adds the taint-tracking queries that matter here:
          # user input reaching a shell command or a network call.
          queries: security-extended
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
